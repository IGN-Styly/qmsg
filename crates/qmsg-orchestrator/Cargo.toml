[package]
name = "qmsg-orchestrator"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
qmsg-types.workspace = true
serde.workspace = true
tokio = { version = "1.53", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = "49"
wasmtime-wasi = "49"
